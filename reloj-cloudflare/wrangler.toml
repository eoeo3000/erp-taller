# Solo hace falta para publicar desde la terminal (`npx wrangler deploy` en esta carpeta).
# Desde el panel de Cloudflare basta con pegar worker.js; ver README.md.
name = "erp-taller-reloj"
main = "worker.js"
compatibility_date = "2024-09-23"

[triggers]
# UTC. 08:00 UTC = 05:00 en Chile continental en verano, 04:00 en invierno.
crons = ["0 8 * * *"]

# Los dos secretos NO van acá (este archivo está en el repositorio):
#   npx wrangler secret put RESPALDO_URL
#   npx wrangler secret put RESPALDO_TOKEN
